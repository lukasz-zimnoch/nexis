name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/nexis-pipeline/ghcr-remote/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Terraform owns every field on these two resources except the container
      # image — env vars, scaling, resources, secrets, service account, command,
      # and timeout. Passing only `image` here makes a targeted API update that
      # leaves everything else untouched.
      - name: Update Cloud Run Service image
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nexis
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}

      - name: Update Cloud Run Job image
        run: |
          gcloud run jobs update nexis-job \
            --image=${{ env.IMAGE }} \
            --region=${{ env.REGION }}
